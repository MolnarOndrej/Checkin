<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101119">
  <title>Checkin</title>
  <link rel="icon" href="/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <svg class="symbols" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-activities" viewBox="0 0 24 24">
      <path d="M4 6h6m4 0h6M4 12h11m4 0h1M4 18h2m4 0h10"/>
      <circle cx="12" cy="6" r="2"/><circle cx="17" cy="12" r="2"/><circle cx="8" cy="18" r="2"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"/>
    </symbol>
    <symbol id="icon-bin" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5"/>
    </symbol>
    <symbol id="icon-pencil" viewBox="0 0 24 24">
      <path d="m4 20 1-5L16 4a2.1 2.1 0 0 1 3 3L8 18l-4 2ZM14 6l4 4"/>
    </symbol>
    <symbol id="icon-arrow" viewBox="0 0 24 24">
      <path d="m9 6 6 6-6 6"/>
    </symbol>
  </svg>

  <header class="toolbar">
    <button type="button" id="back-today" class="today-button" hidden>Today</button>
    <button type="button" id="manage" class="icon-button manage-button" aria-label="Manage activities" title="Manage activities" disabled>
      <svg class="icon" aria-hidden="true"><use href="#icon-activities"></use></svg>
    </button>
  </header>

  <main>
    <div class="journal-error" id="journal-error" hidden>
      <p class="form-error" role="alert">Could not load your saved journal.</p>
      <button type="button" class="text-button" id="retry-journal">Retry</button>
    </div>
    <section id="timeline" class="timeline" aria-label="Daily activity timeline" aria-describedby="timeline-help">
      <p class="sr-only" id="timeline-help">Swipe, drag, or use the arrow keys to move between days. Select a day to view its activity.</p>
      <div class="graph-paper" aria-hidden="true"></div>
      <canvas id="graph" aria-hidden="true"></canvas>
      <div id="year-labels" class="year-labels" aria-hidden="true"></div>
      <div id="days" class="days"></div>
    </section>

    <section id="day-drawer" class="day-drawer" aria-labelledby="selected-date" hidden>
      <header class="drawer-header">
        <h1 id="selected-date"></h1>
        <button type="button" id="close-day" class="icon-button quiet" aria-label="Close day" title="Close day">
          <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
        </button>
      </header>
      <div id="day-content" class="drawer-content"></div>
    </section>
    <p id="announcement" class="sr-only" role="status"></p>

    <dialog id="dialog" aria-labelledby="dialog-title">
      <div class="dialog-panel">
        <header class="dialog-header">
          <h2 id="dialog-title"></h2>
          <button type="button" id="close-dialog" class="icon-button quiet" aria-label="Close dialog" title="Close dialog">
            <svg class="icon" aria-hidden="true"><use href="#icon-close"></use></svg>
          </button>
        </header>
        <div id="dialog-content"></div>
      </div>
    </dialog>
    <canvas id="drawer-glow" aria-hidden="true" hidden></canvas>
  </main>
</body>
</html>
